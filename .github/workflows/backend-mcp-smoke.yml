name: Backend MCP Smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-mcp-smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-mcp-smoke.yml"

jobs:
  mcp-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masterfabric
          POSTGRES_PASSWORD: masterfabric
          POSTGRES_DB: masterfabric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masterfabric"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://masterfabric:masterfabric@localhost:5432/masterfabric?sslmode=disable
        run: goose -dir internal/infrastructure/postgres/migrations postgres "$DATABASE_URL" up

      - name: Build server
        working-directory: backend
        run: go build -o bin/server ./cmd/server

      - name: Start server
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: masterfabric
          DB_PASSWORD: masterfabric
          DB_NAME: masterfabric
          DB_SSLMODE: disable
          JWT_SECRET: ci-mcp-smoke-secret
          KAFKA_ENABLED: "false"
          LLM_ENABLED: "false"
        run: |
          ./bin/server &
          echo $! > server.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8080/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start"
          exit 1

      - name: MCP smoke test
        working-directory: backend
        run: node scripts/smoke_api_keys_mcp.mjs

      - name: Stop server
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

# Render Blueprint — agentic-app-reporter backend
# Docs: https://render.com/docs/infrastructure-as-code
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# After deploy, set CORS_ALLOWED_ORIGINS to your frontend URL(s).
#
# LLM: Render has no GPU. Set LLM_BASE_URL / LLM_MODEL / LLM_API_KEY to your
# external MLC or Hugging Face endpoint. See backend/deployments/render-external-llm.md
# Blueprint sync trigger: 2026-07-25T18:50

services:
  - type: web
    name: agentic-app-reporter-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./deployments/Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_WRITE_TIMEOUT_SECONDS
        value: "130"
      - key: KAFKA_ENABLED
        value: "false"
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: gemma
      - key: LLM_ALLOW_MOCK_IN_PRODUCTION
        value: "false"
      - key: LLM_TIMEOUT_SECONDS
        value: "120"
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: LLM_BASE_URL
        value: https://router.huggingface.co/v1
      - key: LLM_MODEL
        value: google/gemma-2-2b-it:featherless-ai
      # Set manually in Render dashboard (secret; not synced from repo on blueprint update):
      - key: LLM_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-app-reporter-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-orpin-nine-72.vercel.app,https://frontend-buse7.vercel.app

databases:
  - name: agentic-app-reporter-db
    plan: free
    region: frankfurt
    databaseName: masterfabric
    user: masterfabric

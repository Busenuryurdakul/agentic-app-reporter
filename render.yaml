# Render Blueprint — agentic-app-reporter backend
# Docs: https://render.com/docs/infrastructure-as-code
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# After deploy, set CORS_ALLOWED_ORIGINS to your frontend URL(s).
#
# LLM: Render has no GPU. Point LLM_BASE_URL at your VPS Ollama endpoint (HTTPS).
# See backend/deployments/render-ollama-production.md
# Blueprint sync trigger: 2026-07-28T01:10

services:
  - type: web
    name: agentic-app-reporter-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./deployments/Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_WRITE_TIMEOUT_SECONDS
        value: "130"
      - key: KAFKA_ENABLED
        value: "false"
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: ollama
      - key: LLM_ALLOW_MOCK_IN_PRODUCTION
        value: "false"
      - key: LLM_TIMEOUT_SECONDS
        value: "120"
      - key: LLM_MAX_RETRIES
        value: "2"
      # Set manually in Render dashboard after VPS Ollama is provisioned (secret URL; not synced):
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: llama3.2
      # Optional: Bearer token when reverse proxy requires auth
      - key: LLM_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-app-reporter-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-orpin-nine-72.vercel.app,https://frontend-buse7.vercel.app,https://frontend-git-main-buse7.vercel.app,https://agentic-app-reporter.vercel.app,https://agentic-app-reporter-buse7.vercel.app,https://agentic-app-reporter-git-main-buse7.vercel.app

databases:
  - name: agentic-app-reporter-db
    plan: free
    region: frankfurt
    databaseName: masterfabric
    user: masterfabric

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Use when API runs on the host (e.g. backend\bin\server.exe on Windows :8080)
  # and monitoring stack runs in Docker without the compose api/nginx services.
  - job_name: masterfabric-api-native
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: masterfabric-api-native
